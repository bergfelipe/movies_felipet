services:
  - type: web
    name: movies_felipet
    env: ruby
    plan: free
    region: oregon
    buildCommand: |
      apt-get update -qq && apt-get install -y libvips libvips-dev pkg-config
      bundle install
      bundle exec rails assets:precompile
      bundle exec rails db:migrate
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_URI_BASE
        sync: false
      - key: OPENROUTER_DATA_COLLECTION
        sync: false
      - key: OPENROUTER_ZDR
        sync: false
      - key: OPENROUTER_SEND_ATTRIBUTION
        sync: false
      - key: OPENROUTER_HTTP_REFERER
        sync: false
      - key: OPENROUTER_APP_NAME
        sync: false
