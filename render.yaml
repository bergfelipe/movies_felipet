services:
  - type: web
    name: movies_felipet
    env: ruby
    plan: free
    region: oregon
    buildCommand: |
      apt-get update -qq && apt-get install -y libvips libvips-dev pkg-config
      bundle install
      bundle exec rails assets:precompile
      bundle exec rails db:migrate
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
